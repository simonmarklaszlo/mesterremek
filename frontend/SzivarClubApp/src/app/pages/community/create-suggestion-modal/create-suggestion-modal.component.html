<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Új bolt hozzáadása</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- ÚJ BOLT FORM -->
  <div class="section">
    <h3 class="section-title">
      <ion-icon name="storefront-outline"></ion-icon>
      Bolt adatai
    </h3>

    <ion-list lines="none" class="form-list">
      <ion-item>
        <ion-label position="stacked">Bolt neve *</ion-label>
        <ion-input
          [(ngModel)]="newShop.name"
          placeholder="pl. Havana Cigar Lounge"
          type="text"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Cím *</ion-label>
        <ion-input
          [(ngModel)]="newShop.address"
          placeholder="pl. Erzsébet körút 43."
          type="text"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Város *</ion-label>
        <ion-input
          [(ngModel)]="newShop.city"
          placeholder="pl. Budapest"
          type="text"
        ></ion-input>
      </ion-item>
    </ion-list>

    <!-- Nyitvatartás -->
    <h3 class="section-title">
      <ion-icon name="time-outline"></ion-icon>
      Nyitvatartás
    </h3>

    <ion-list lines="none" class="opening-hours-list">
      <ion-item *ngFor="let day of openingHours" class="opening-hour-item">
        <div class="day-content">
          <span class="day-name">{{ day.dayOfWeek }}</span>

          <div class="time-section" *ngIf="!day.isClosed">
            <ion-input
              [(ngModel)]="day.openHour"
              type="time"
              class="time-input"
            ></ion-input>
            <span class="time-separator">-</span>
            <ion-input
              [(ngModel)]="day.closeHour"
              type="time"
              class="time-input"
            ></ion-input>
          </div>

          <span class="closed-text" *ngIf="day.isClosed">Zárva</span>

          <ion-checkbox
            [(ngModel)]="day.isClosed"
            class="closed-checkbox"
            [attr.aria-label]="day.dayOfWeek + ' zárva'"
          ></ion-checkbox>
        </div>
      </ion-item>
    </ion-list>
  </div>

  <!-- Submit gomb -->
  <div class="submit-section">
    <!-- Error message -->
    <ion-text *ngIf="errorMessage" color="danger" class="error-message">
      <p>{{ errorMessage }}</p>
    </ion-text>

    <ion-button
      expand="block"
      [disabled]="!isFormValid() || isSubmitting"
      (click)="submitSuggestion()"
      class="submit-btn"
    >
      <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
      <span *ngIf="!isSubmitting">Javaslat beküldése</span>
    </ion-button>
    <ion-text color="medium" class="hint-text">
      A javaslat beküldése után a közösség szavazhat róla.
      Ha eléri a +5 szavazatot, jóváhagyásra kerül.
    </ion-text>
  </div>
</ion-content>
