<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Bejelentkezés</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <div class="logo-section">
      <ion-icon name="bonfire-outline" class="logo-icon"></ion-icon>
      <h1>Szivar Club</h1>
      <p>Jelentkezz be a folytatáshoz</p>
    </div>

    <!-- Hibaüzenet megjelenítése -->
    <ion-text color="danger" *ngIf="errorMessage">
      <p class="error-message">{{ errorMessage }}</p>
    </ion-text>

    <form (ngSubmit)="onLogin()">
      <ion-list lines="none" class="login-form">
        <ion-item class="input-item">
          <ion-input
            label="Email"
            labelPlacement="floating"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="pelda@email.com"
            [disabled]="isLoading"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item">
          <ion-input
            label="Jelszó"
            labelPlacement="floating"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            [disabled]="isLoading"
          ></ion-input>
        </ion-item>

        <ion-button
          expand="block"
          type="submit"
          class="login-button"
          [disabled]="!email || !password || isLoading"
        >
          <ion-icon slot="start" name="log-in-outline" *ngIf="!isLoading"></ion-icon>
          {{ isLoading ? 'Bejelentkezés...' : 'Bejelentkezés' }}
        </ion-button>
      </ion-list>
    </form>

    <div class="footer-links">
      <ion-button fill="clear" size="small">
        Elfelejtett jelszó?
      </ion-button>
      <ion-text color="medium">
        <p>Nincs még fiókod? <ion-button fill="clear" size="small" (click)="goToRegister()">Regisztráció</ion-button></p>
      </ion-text>
    </div>
  </div>
</ion-content>
